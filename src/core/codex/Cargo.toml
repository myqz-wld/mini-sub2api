[package]
name = "mini-sub2api-core-codex"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "=1.11.1"
chrono = { version = "=0.4.43", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
flate2 = { version = "=1.1.8", default-features = false, features = ["zlib-rs"] }
futures-util = "=0.3.32"
http = "=1.4.0"
hyper-util = { version = "=0.1.20", features = ["client-proxy", "client-proxy-system"] }
mini-sub2api-protocol-v1 = { path = "../../protocol/v1/rust" }
os_info = "=3.14.0"
rand = "=0.9.3"
reqwest = { version = "=0.12.28", features = ["cookies", "json", "rustls-tls-native-roots-no-provider", "stream"] }
rustls = { version = "=0.23.36", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
rustls-native-certs = "=0.8.3"
rustls-pki-types = "=1.14.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
sha1 = "=0.10.6"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "=0.26.4"
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186", features = ["proxy", "rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f", features = ["deflate", "proxy"] }
url = "2"
urlencoding = "=2.1.3"
uuid = { version = "=1.20.0", features = ["v4", "v7"] }
webbrowser = "1"
zlib-rs = { version = "=0.5.5", default-features = false }
zstd = "=0.13.3"

[dev-dependencies]
pretty_assertions = "1"
reqwest-websocket = "0.5.1"
tempfile = "3"
